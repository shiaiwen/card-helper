<script>

	window.loadElectronFrame();
	let debounceTimeout;
	const images = ['res/1.png', 'res/2.png', 'res/3.png', 'res/4.png'];

	function changeImage() {
		clearTimeout(debounceTimeout);
		debounceTimeout = setTimeout(() => {
			// 随机选择一个图像路径
			const randomImage = images[Math.floor(Math.random() * images.length)];
			// 设置图像的 src 属性
			document.getElementById('icon').src = randomImage;
		}, 300); // 300 毫秒的防抖时间
	}

	function resetImage(){
		clearTimeout(debounceTimeout);
		document.getElementById('icon').src = 'res/0.png';
	}
</script>
